esphome:
  name: clock-display
  friendly_name: "Clock Display"
  on_boot:
    - priority: -100.0  # Very early in the boot process.
      then:
        - uart.write:
            id: uart_display
            data: "BOOTING...\r"
    - priority: -10
      then:
        - script.execute: send_time_loop
        - script.execute: ntp_resync_loop

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    then:
      - logger.log:
          level: INFO
          format: "Wi-Fi connected successfully."
  ap:
    ap_timeout: "0s"
  manual_ip:
    static_ip: 10.11.12.13
    gateway: 10.11.12.1
    subnet: 255.255.255.0
    dns1: 10.11.12.1
    dns2: 1.1.1.1

captive_portal:

web_server:
  port: 80
  include_internal: True
  version: 3

time:
  - platform: sntp
    id: sntp_time
    servers:
      - 10.11.12.1    # Router is also an NTP server, if yours is not
      - 10.11.12.1    # consider Chrony.
    timezone: "AST4"  # Bad Bunny-land, change as per your location.

uart:
  id: uart_display
  tx_pin: 4        # D4.
  rx_pin: 5        # Not used, but must be specified.
  baud_rate: 9600

script:
  - id: send_time_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: |
              return true;
          then:
            - lambda: |-
                if (id(display_output).state && id(sntp_time).now().is_valid()) {
                  char buffer[16];
                  auto t = id(sntp_time).now();
                  int hour = t.hour;
                  int minute = t.minute;
                  int second = t.second;

                  std::string format = id(time_format).current_option();
                  int hour_mode = static_cast<int>(id(hour_mode_setting).state);

                  if (format == " HH:MM:SS ") {
                    if (hour_mode == 12) {
                      int hour12 = hour % 12;
                      if (hour12 == 0) hour12 = 12;
                      snprintf(buffer, sizeof(buffer), " %02d:%02d:%02d\r", hour12, minute, second);
                    } else {
                      snprintf(buffer, sizeof(buffer), " %02d:%02d:%02d\r", hour, minute, second);
                    }
                  } else if (format == " HH:MM AM ") {
                    int hour12 = hour % 12;
                    if (hour12 == 0) hour12 = 12;
                    const char* ampm = (hour < 12) ? "AM" : "PM";
                    snprintf(buffer, sizeof(buffer), " %02d:%02d %s\r", hour12, minute, ampm);
                  } else if (format == "HH:MM:SS A") {
                    int hour12 = hour % 12;
                    if (hour12 == 0) hour12 = 12;
                    const char* ampm = (hour < 12) ? "A" : "P";
                    snprintf(buffer, sizeof(buffer), "%02d:%02d:%02d %s\r", hour12, minute, second, ampm);
                  } else if (format == "   HH:MM  ") {
                    if (hour_mode == 12) {
                      int hour12 = hour % 12;
                      if (hour12 == 0) hour12 = 12;
                      snprintf(buffer, sizeof(buffer), "   %02d:%02d  \r", hour12, minute);
                    } else {
                      snprintf(buffer, sizeof(buffer), "   %02d:%02d  \r", hour, minute);
                    }
                  }

                  id(uart_display).write_str(buffer);
                }
            - delay: 250ms

  - id: ntp_resync_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: |
              return true;
          then:
            - lambda: |-
                ESP_LOGI("ntp", "Performing periodic NTP resync...");
                id(sntp_time).update();
            - delay: 15min

  - id: force_sync_script
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("sync", "Manual time sync requested...");
          id(sntp_time).update();
      - wait_until:
          condition:
            lambda: |
              return id(sntp_time).now().is_valid();
          timeout: 2s
      - uart.write:
          id: uart_display
          data: "\r"
      - delay: 500ms
      - uart.write:
          id: uart_display
          data: "TIME SYNC\r"
      - delay: 2500ms
      - uart.write:
          id: uart_display
          data: "\r"
      - delay: 500ms

switch:
  - platform: template
    name: "Display Output"
    id: display_output
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_off_action:
      - uart.write:
          id: uart_display
          data: "\r"

number:
  - platform: template
    name: "Display Brightness"
    id: display_brightness
    min_value: 1
    max_value: 9
    step: 1
    restore_value: true
    set_action:
      - lambda: |-
          // Update internal state so id(display_brightness).state is current
          id(display_brightness).publish_state(x);
          char cmd[3];
          cmd[0] = 0x1B;      // ESC
          cmd[1] = 'B';       // Brightness command
          cmd[2] = (int)x + '0';
          id(uart_display).write_array((uint8_t*)cmd, 3);
          
  - platform: template
    id: hour_mode_setting
    name: "Hour Mode"
    min_value: 12
    max_value: 24
    step: 12
    initial_value: 12
    restore_value: true
    optimistic: true

select:
  - platform: template
    id: time_format
    name: "Time Format"
    optimistic: true
    restore_value: true
    initial_option: " HH:MM:SS "
    options:
      - " HH:MM:SS "
      - " HH:MM AM "
      - "HH:MM:SS A"
      - "   HH:MM  "

button:
  - platform: template
    name: "Force Time Sync"
    id: force_time_sync
    on_press:
      - script.execute: force_sync_script

